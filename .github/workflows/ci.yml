name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  database:
    name: migrations + RLS assertions (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aij_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version

      # The shim stands in for Supabase's own bootstrap (roles, auth schema,
      # auth.uid(), default privileges) so the migrations can be applied
      # unchanged to a stock Postgres. Then: every migration in filename order,
      # then the RLS assertions, which exit non-zero on any failure. A schema
      # whose RLS has never been executed is not verified.
      # See supabase/test-support/README.md — test-only, never applied to a real
      # Supabase project.
      - name: Apply shim, migrations and RLS assertions
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aij_test
        run: npm run test:db

      # The demo tenant (supabase/seed/): one Lagos fashion vendor, 20 products,
      # its policies, 16 FAQs, its owner and both Meta channels — the data every
      # later feature is built against. `--twice` applies the seed a second time
      # and compares an md5 fingerprint of all the fixture rows between the two
      # runs, so a seed that duplicates its tenant, drifts from the channel
      # routing keys PR 4 resolves tenants by, or breaks the negotiation ladder
      # fails here rather than on a machine that happened to be seeded once.
      - name: Seed the demo tenant (twice, for idempotency) and assert it
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aij_test
        run: npm run seed -- --twice
